spring:
  application:
    name: loan-management
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/challengue}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /api/v1/loans

logging:
  level:
    root: INFO
    com.loanmanagement: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Loan Management
    description: API REST para gestión de solicitudes de préstamos
    version: 1.0.0
    java: 21

resilience4j:
  circuitbreaker:
    instances:
      loanApplication:
        registerHealthIndicator: true
        failureRateThreshold: 50
        waitDurationInOpenState: 1000
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 5
        slidingWindowType: COUNT_BASED
  ratelimiter:
    instances:
      loanApplication:
        limitForPeriod: ${LIMIT_FOR_PERIOD:1}
        limitRefreshPeriod: ${LIMIT_REFRESH_FOR_PERIOD:10s}
        timeoutDuration: ${TIMEOUT_DURATION:0s}